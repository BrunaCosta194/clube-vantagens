name: sem-cpf
# O repositório é público: nenhum CPF pode entrar no código (mídia kit, site, migrations).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sem-cpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - run: node scripts/sem-cpf.mjs
